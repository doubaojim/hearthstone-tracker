<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>炉石记牌器</title>
<meta name="theme-color" content="#12161D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="炉石记牌器">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="https://aka.doubaocdn.com/s/UOsmD99zFY">
<style>
  :root{
    --bg:#12161D; --panel:#1A212C; --card:#222B3A;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --gold:#D9B36C; --gold2:#F0C75E; --blue:#3E9BF0; --green:#4CAF7D;
    --red:#E2534B; --orange:#F0AE4E; --text:#EDEBE4; --muted:#8B93A5;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#0A0D12;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:var(--text);overflow-x:hidden;}
  .stage{margin:0 auto;position:relative;}

  .app{
    height:100vh;height:100dvh;max-width:470px;margin:0 auto;
    display:flex;flex-direction:column;
    background:radial-gradient(120% 60% at 50% -10%, #1B2431 0%, var(--bg) 55%);
    position:relative;overflow:visible;box-shadow:0 0 0 1px var(--line);
  }
  .app-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 76px;-webkit-overflow-scrolling:touch;}
  .app-scroll::-webkit-scrollbar{width:0;}

  .app-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
  }
  .app-header .brand{display:flex;align-items:center;gap:9px;}
  .brand .logo{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(145deg,var(--gold2),#A87E3A);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(217,179,108,.35);
  }
  .brand .logo svg{width:18px;height:18px;}
  .brand b{font-size:16px;letter-spacing:.5px;}
  .app-header .ver{font-size:10px;color:var(--muted);}

  .tabbar{
    display:flex;border-top:1px solid var(--line);background:rgba(18,22,29,.97);
    backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom);
    position:sticky;bottom:0;z-index:30;flex-shrink:0;
  }
  .tabbar button{
    flex:1;background:none;border:none;color:var(--muted);padding:8px 0 7px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;cursor:pointer;
  }
  .tabbar button.active{color:var(--gold2);}
  .tabbar .t-ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .tabbar .t-ico svg{width:20px;height:20px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .panel + .panel{margin-top:14px;}
  .panel-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:12px;}
  .panel-title .dot{width:7px;height:7px;border-radius:50%;}

  .stat-row{display:flex;gap:9px;margin-bottom:14px;}
  .stat{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:10px 4px 8px;text-align:center;
  }
  .stat .v{font-size:22px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
  .stat .t{font-size:10px;color:var(--muted);margin-top:3px;}

  .mana{
    width:26px;height:26px;flex:none;
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    background:linear-gradient(180deg,#79C6FF,#2E7BD6);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff;
    box-shadow:0 1px 6px rgba(62,155,240,.5);
  }
  .mana.gold{background:linear-gradient(180deg,var(--gold2),#A87E3A);box-shadow:0 1px 6px rgba(217,179,108,.5);}
  .mana.sm{width:20px;height:20px;font-size:10px;}

  .btn{
    border:none;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600;
    cursor:pointer;color:var(--text);background:var(--card);display:inline-flex;
    align-items:center;justify-content:center;gap:6px;transition:filter .12s;
  }
  .btn:active{filter:brightness(1.2);}
  .btn.primary{background:linear-gradient(180deg,var(--gold2),#B98A3C);color:#1A1408;font-weight:700;}
  .btn.blue{background:rgba(62,155,240,.16);color:var(--blue);border:1px solid rgba(62,155,240,.3);}
  .btn.green{background:rgba(76,175,125,.14);color:var(--green);border:1px solid rgba(76,175,125,.3);}
  .btn.red{background:rgba(226,83,75,.14);color:var(--red);border:1px solid rgba(226,83,75,.3);}
  .btn.gray{background:rgba(139,147,165,.12);color:var(--muted);}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .act-row{display:flex;gap:8px;margin-bottom:12px;}
  .act-row .btn{flex:1;flex-direction:column;padding:9px 6px;font-size:10px;}
  .act-row .btn svg{width:17px;height:17px;}
  .settle-row{display:flex;gap:10px;}
  .settle-row .btn{flex:1;padding:12px 8px;flex-direction:column;}
  .settle-row .btn svg{width:18px;height:18px;}

  .card-row{
    display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line);
  }
  .card-row:first-child{border-top:none;}
  .card-row .info{flex:1;min-width:0;}
  .card-row .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-row .sub{font-size:10px;color:var(--muted);margin-top:2px;}
  .pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(217,179,108,.13);color:var(--gold);}
  .pill.green{background:rgba(76,175,125,.13);color:var(--green);}
  .pill.blue{background:rgba(62,155,240,.13);color:var(--blue);}
  .pill.red{background:rgba(226,83,75,.13);color:var(--red);}
  .pill.gray{background:rgba(139,147,165,.12);color:var(--muted);}
  .micro{display:flex;gap:4px;}
  .micro button{
    border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--muted);
    border-radius:7px;font-size:10px;padding:4px 6px;cursor:pointer;
  }
  .micro button:active{background:rgba(255,255,255,.12);}

  .tavern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;}
  .minion{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;
    transition:transform .1s;
  }
  .minion:active{transform:scale(.96);}
  .minion .art{
    height:56px;border-radius:8px;margin-bottom:6px;position:relative;padding:5px;
    background:linear-gradient(160deg,rgba(217,179,108,.22),rgba(26,33,44,.4));
    border:1px solid var(--line);
  }
  .minion .art .c{font-size:11px;font-weight:800;color:var(--blue);}
  .minion .art .stars{position:absolute;right:5px;top:5px;font-size:8px;color:var(--gold);letter-spacing:-1px;}
  .minion .art .stat{position:absolute;right:5px;bottom:4px;font-size:10px;font-weight:700;}
  .minion .art .tribe{position:absolute;left:5px;bottom:4px;font-size:9px;color:var(--muted);}
  .minion .nm2{font-size:11px;font-weight:600;line-height:1.25;min-height:27px;}
  .minion .st{font-size:9px;color:var(--muted);margin-top:3px;}
  .minion.sold{opacity:.55;}
  .minion.tripled{border-color:var(--gold);}

  .h-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .h-scroll::-webkit-scrollbar{height:0;}

  .tribe-wrap{display:flex;flex-wrap:wrap;gap:7px;}
  .tribe{
    border:1px solid var(--line2);background:var(--panel);color:var(--muted);
    border-radius:20px;font-size:11px;padding:7px 12px;cursor:pointer;
  }
  .tribe.on{background:var(--gold);border-color:var(--gold);color:#1A1408;font-weight:700;}
  .chip-label{font-size:11px;color:var(--muted);margin:10px 0 6px;}

  .deck-hero{
    display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;margin-bottom:14px;
  }
  .deck-hero .ava{
    width:46px;height:46px;border-radius:12px;background:linear-gradient(145deg,rgba(217,179,108,.35),rgba(217,179,108,.1));
    display:flex;align-items:center;justify-content:center;color:var(--gold);
  }
  .code-box{background:#0F131A;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--muted);word-break:break-all;margin-top:8px;}

  .kv{display:flex;justify-content:space-between;font-size:13px;padding:11px 0;border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:600;}
  .note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:8px;}

  .hist-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-item .md{font-weight:700;}
  .hist-item .lb{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-item .tm{color:var(--muted);font-size:10px;}

  .modal-mask{position:fixed;inset:0;background:rgba(8,10,14,.7);display:none;align-items:flex-end;z-index:40;}
  .modal-mask.show{display:flex;}
  .sheet{width:100%;background:var(--panel);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));margin-bottom:12px;max-height:86vh;overflow-y:auto;}
  .sheet h4{font-size:15px;margin-bottom:10px;}
  .sheet .row{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);}
  .sheet .row:last-child{border-bottom:none;}
  .sheet .row .lb{color:var(--muted);}
  .sheet .row .vl{font-weight:700;color:var(--gold);}

  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .seg button{flex:1;background:none;border:none;color:var(--muted);font-size:12px;padding:9px 0;cursor:pointer;border-right:1px solid var(--line);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:rgba(217,179,108,.16);color:var(--gold2);font-weight:700;}
  .toast{
    position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);
    background:rgba(20,26,36,.96);border:1px solid var(--gold);color:var(--gold2);
    padding:10px 16px;border-radius:12px;font-size:12px;font-weight:600;z-index:30;
    box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:all .25s;white-space:nowrap;
    pointer-events:none;
  }
  .curve-wrap{display:flex;gap:4px;align-items:flex-end;}
  .curve-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;}
  .curve-bar-area{width:100%;display:flex;align-items:flex-end;justify-content:center;height:44px;}
  .curve-bar{width:12px;background:linear-gradient(180deg,var(--gold2),#A87E3A);border-radius:3px 3px 0 0;}
  .curve-num{font-size:9px;color:var(--muted);}
</style>
</head>
<body>

<div class="stage" id="stage">
    <div class="app">
      <div class="app-header">
        <div class="brand">
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 1.5 22 7v10l-10 5.5L2 17V7l10-5.5Z" stroke="#1A1408" stroke-width="1.6"/><path d="M12 6.2 18.4 9.6v6.8L12 19.8 5.6 16.4V9.6L12 6.2Z" fill="#1A1408"/></svg>
          </div>
          <b>炉石记牌器</b>
        </div>
        <div class="ver">v1.1 · 每日更新</div>
      </div>

      <div class="app-scroll" id="screen"></div>

      <nav class="tabbar" id="tabbar">
        <button data-tab="constructed" class="active">
          <span class="t-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 21 7v10l-9 5-9-5V7l9-5Z" stroke="currentColor" stroke-width="1.7"/><path d="M12 7 16.5 9.5v5L12 17l-4.5-2.5v-5L12 7Z" stroke="currentColor" stroke-width="1.4"/></svg></span>
          对局
        </button>
        <button data-tab="decks">
          <span class="t-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4 21 8l-9 4-9-4 9-4Z" stroke="currentColor" stroke-width="1.7"/><path d="M5 11v5c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-5" stroke="currentColor" stroke-width="1.7"/></svg></span>
          卡组
        </button>
        <button data-tab="battlegrounds">
          <span class="t-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 10h14l-1 8H6l-1-8Z" stroke="currentColor" stroke-width="1.7"/><path d="M5 10 7 5h10l2 5" stroke="currentColor" stroke-width="1.7"/><path d="M9 12v3M12 12v3M15 12v3" stroke="currentColor" stroke-width="1.5"/></svg></span>
          酒馆
        </button>
        <button data-tab="settings">
          <span class="t-ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
          设置
        </button>
      </nav>

      <div class="modal-mask" id="modalMask">
        <div class="sheet" id="sheet"></div>
      </div>
      <div class="toast" id="toastBox"></div>
    </div>
</div>

<script>
/* ============================================================
   数据与状态
   ============================================================ */
var cardPool = [
  {name:'寒冰箭',cost:2,tribe:'',total:2},{name:'火球术',cost:4,tribe:'',total:2},
  {name:'奥术智慧',cost:3,tribe:'',total:2},{name:'法力浮龙',cost:1,tribe:'',total:2},
  {name:'冰霜新星',cost:3,tribe:'',total:2},{name:'烈焰风暴',cost:7,tribe:'',total:2},
  {name:'咒术师的召唤',cost:3,tribe:'',total:2},{name:'鱼人猎潮者',cost:1,tribe:'鱼人',total:2},
  {name:'苦痛侍僧',cost:3,tribe:'',total:2},{name:'石牙野猪',cost:1,tribe:'野兽',total:2}
];

/* 当前卡组（盒子风格显示用，可"使用此卡组"带入追踪） */
var demoDeck = [
  {name:'法力浮龙',cost:1,count:2},{name:'石牙野猪',cost:1,count:1},
  {name:'寒冰箭',cost:2,count:2},{name:'鱼人猎潮者',cost:1,count:1},
  {name:'奥术智慧',cost:3,count:2},{name:'冰霜新星',cost:3,count:2},
  {name:'咒术师的召唤',cost:3,count:2},{name:'苦痛侍僧',cost:3,count:1},
  {name:'火球术',cost:4,count:2},{name:'烈焰风暴',cost:7,count:2}
];

var bgPool = [
  {name:'机械袋鼠',cost:1,tribe:'机械',tier:1,a:1,h:1},
  {name:'南海船工',cost:1,tribe:'海盗',tier:1,a:2,h:1},
  {name:'石塘猎人',cost:2,tribe:'鱼人',tier:2,a:2,h:3},
  {name:'愤怒的巨魔',cost:2,tribe:'野兽',tier:2,a:4,h:4},
  {name:'量产型恐吓机',cost:3,tribe:'机械',tier:2,a:3,h:4},
  {name:'恶魔卫士',cost:3,tribe:'恶魔',tier:2,a:3,h:3},
  {name:'雏龙走私商',cost:2,tribe:'龙',tier:2,a:2,h:4},
  {name:'元素熔岩',cost:3,tribe:'元素',tier:2,a:3,h:4},
  {name:'废铁回收机',cost:4,tribe:'机械',tier:3,a:4,h:4},
  {name:'青铜守卫',cost:5,tribe:'龙',tier:4,a:4,h:6},
  {name:'棘皮食人魔',cost:4,tribe:'野兽',tier:4,a:4,h:7},
  {name:'主母',cost:6,tribe:'鱼人',tier:6,a:8,h:8}
];

var heroes = [
  {name:'米尔豪斯·法力风暴',hp:40,power:'刷新酒馆费用为 1 枚铸币'},
  {name:'拉法姆',hp:40,power:'回合结束从酒馆偷一个随从'},
  {name:'尤格-萨隆',hp:40,power:'随机施放法术'},
  {name:'馆长',hp:40,power:'开局获得一个融合怪'},
  {name:'挂机的阿凯',hp:40,power:'跳过后获得酒馆升级'},
  {name:'范克里夫',hp:40,power:'回合开始获得 1 铸币'}
];

var classes = ['法师','猎人','德鲁伊','牧师','战士','圣骑士','术士','潜行者','萨满祭司','恶魔猎手','死亡骑士'];
var tribes = ['野兽','机械','龙','鱼人','海盗','元素','恶魔','亡灵','娜迦','野猪人'];

var state = {
  tab:'constructed',
  matchActive:false,
  inMatch:false,
  matchMode:'standard',
  setupPhase:null,
  setup:{ myClass:'法师', oppClass:'法师' },
  match:{ turn:1, mana:1, manaMax:1, myDeck:30, myHand:0, oppDeck:30, oppHand:0, myFatigue:0, oppFatigue:0, myGrave:0, oppGrave:0, myPlayed:[], oppPlayed:[], oppSeen:[] },
  trackers: cardPool.map(function(c){ return {name:c.name,cost:c.cost,tribe:c.tribe,total:c.total,deck:c.total,hand:0,played:0}; }),
  bg:{ hero:null, tier:1, turn:1, hp:40, gold:3, refreshes:0, tavern:[], owned:[], tribes:{}, opponents:[], oppIdx:0, boardShot:null, minSearch:'' },
  history:[],
  imported:0,
  browser:{ cls:'ALL', cost:'', q:'', limit:12, coll:'collect', set:'ALL', hidden:false },
  bgBrowser:{ q:'', limit:18 },
  decks:[],
  currentDeckId:null,
  previewDeck:null
};

/* ============================================================
   持久化
   ============================================================ */
function save(){
  try{ localStorage.setItem('hs_tracker', JSON.stringify({ history:state.history, setup:state.setup, decks:state.decks, currentDeckId:state.currentDeckId, bg:state.bg })); }catch(e){}
}
function load(){
  try{
    var d = JSON.parse(localStorage.getItem('hs_tracker')||'{}');
    if(Array.isArray(d.history)) state.history = d.history;
    if(d.setup) state.setup = d.setup;
    if(Array.isArray(d.decks)) state.decks = d.decks;
    if(d.currentDeckId!=null) state.currentDeckId = d.currentDeckId;
    if(d.bg) state.bg = Object.assign(state.bg, d.bg);
  }catch(e){}
}
function record(mode, label, result, turns){
  state.history.unshift({ mode:mode, label:label, result:result, turns:turns, date:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) });
  save(); render();
}

/* ============================================================
   真实卡牌数据库（HearthstoneJSON，与盒子/HDT 同源，每日自动更新）
   ============================================================ */
var CARD_URL='https://api.hearthstonejson.com/v1/latest/zhCN/cards.collectible.json';
var DAY=86400000;
var cardDB = { loaded:false, list:[], byDbf:{}, byName:{}, lastUpdated:null };
var clsMap={MAGE:'法师',HUNTER:'猎人',PRIEST:'牧师',WARLOCK:'术士',ROGUE:'潜行者',DRUID:'德鲁伊',
  SHAMAN:'萨满祭司',WARRIOR:'战士',PALADIN:'圣骑士',DEMONHUNTER:'恶魔猎手',DEATHKNIGHT:'死亡骑士',NEUTRAL:'中立'};
var SET_NAMES={
  'CORE':'核心系列','VANILLA':'经典','EXPERT1':'经典','LEGACY':'经典·遗产','CORE_HIDDEN':'核心系列',
  'THE_BARRENS':'贫瘠之地的锤炼','THE_SUNKEN_CITY':'探寻沉没之城','ALTERAC_VALLEY':'奥特兰克的决裂',

/* 套牌代码解码（炉石标准 v1 格式，与炉石盒子 / HDT 互通） */
function readVarint(bytes,off){
  var r=0,s=0,b;
  do{ b=bytes[off++]; r|=(b&0x7F)<<s; s+=7; }while(b&0x80);
  return [r,off];
}
function decodeDeckstring(code){
  try{
    var clean=String(code).replace(/#.*$/gm,'').replace(/\s+/g,'');
    var bin=atob(clean);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    var off=0, t;
    var reserved=bytes[off++]; var version=bytes[off++];
    t=readVarint(bytes,off); var fmt=t[0]; off=t[1];
    t=readVarint(bytes,off); var nh=t[0]; off=t[1];
    var heroes=[],i;
    for(i=0;i<nh;i++){ t=readVarint(bytes,off); heroes.push(t[0]); off=t[1]; }
    t=readVarint(bytes,off); var ns=t[0]; off=t[1];
    var singles=[];
    for(i=0;i<ns;i++){ t=readVarint(bytes,off); singles.push(t[0]); off=t[1]; }
    t=readVarint(bytes,off); var nd=t[0]; off=t[1];
    var doubles=[];
    for(i=0;i<nd;i++){ t=readVarint(bytes,off); doubles.push(t[0]); off=t[1]; }
    t=readVarint(bytes,off); var nm=t[0]; off=t[1];
    var multis=[];
    for(i=0;i<nm;i++){ t=readVarint(bytes,off); var a=t[0]; off=t[1]; t=readVarint(bytes,off); multis.push([a,t[0]]); off=t[1]; }
    var cards=[];
    singles.forEach(function(id){ cards.push([id,1]); });
    doubles.forEach(function(id){ cards.push([id,2]); });
    multis.forEach(function(p){ cards.push([p[0],p[1]]); });
    return { version:version, format:fmt, heroes:heroes, cards:cards };
  }catch(e){ return null; }
}

function toggleImportHero(name){
  var b=state.bg;
  if(b.importMyHero===name){
    b.importMyHero='';
    if(b.importOppHeroes.indexOf(name)<0) b.importOppHeroes.push(name);
  } else if(b.importOppHeroes.indexOf(name)>-1){
    b.importOppHeroes=b.importOppHeroes.filter(function(x){return x!==name;});
  } else {
    if(!b.importMyHero) b.importMyHero=name;
    else if(b.importOppHeroes.length<6) b.importOppHeroes.push(name);
    else toast('最多记录6位对手');
  }
  save(); render();
}
function runHeroOCR(){
  var b=state.bg;
  if(!b.importShot){ toast('请先导入截图'); return; }
  if(!window.Tesseract){
    toast('正在加载识别引擎…');
    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload=function(){ doHeroOCR(b.importShot); };
    sc.onerror=function(){ toast('识别引擎加载失败'); };
    document.head.appendChild(sc);
  } else { doHeroOCR(b.importShot); }
}
function doHeroOCR(dataURL){
  toast('正在识别英雄名称（首次需下载中文模型）…');
  Tesseract.recognize(dataURL,'chi_sim').then(function(res){
    var text=(res&&res.data&&res.data.text)||'';
    var matched=matchHeroesFromText(text);
    state.bg.importHeroes=matched;
    if(matched.length>0 && !state.bg.importMyHero){
      state.bg.importMyHero=matched[0].name;
      for(var i=1;i<matched.length && i<=6;i++){
        if(state.bg.importOppHeroes.indexOf(matched[i].name)<0) state.bg.importOppHeroes.push(matched[i].name);
      }
    }
    save(); render();
    toast('识别到 '+matched.length+' 个英雄');
  }).catch(function(){ toast('识别失败，可手动选择英雄'); });
}
function matchHeroesFromText(text){
  var pool=getHeroes();
  var t=String(text||'').replace(/\s+/g,'');
  var matched=[];
  pool.forEach(function(h){
    if(!h||!h.name) return;
    var nm=String(h.name).replace(/\s+/g,'');
    if(nm.length>=2 && t.indexOf(nm)>-1) matched.push(h);
  });
  return matched.slice(0,10);
}
function startBgMatch(){
  var b=state.bg;
  if(b.importMyHero){
    var hx=getHeroes().find(function(x){return x.name===b.importMyHero;});
    b.hero=hx?hx:{name:b.importMyHero,hp:40,power:''};
  }
  while(b.opponents.length<6) b.opponents.push({name:'',tribes:[],shot:null,defeated:false,turn:0,minions:[]});
  b.importOppHeroes.forEach(function(nm,i){
    if(i<6) b.opponents[i].name=nm;
  });
  b.importShot=null; b.importHeroes=[]; b.importMyHero=''; b.importOppHeroes=[];
  state.setupPhase=null; state.inMatch=true; state.matchMode='battlegrounds'; state.tab='constructed';
  save(); render();
}

function draw(){

function playUnknown(){
  var m=state.match;
  if(m.myHand<=0)return;

}
function discard(){
  var m=state.match;

}
function playHand(name){
  var m=state.match, c=state.trackers.find(function(x){return x.name===name;});

  if(c.hand>0){c.hand--;}else{m.myHand--;}
  c.played++; addTo(m.myPlayed,name,c.cost); render();
}
function playFromDeck(name){
  var m=state.match, c=state.trackers.find(function(x){return x.name===name;});

}

}
function oppPlay(){

var derivedDB={loaded:false,loading:false,list:[]};
function ensureDerived(){
  if(derivedDB.loaded||derivedDB.loading) return;
  derivedDB.loading=true;
  fetch('https://api.hearthstonejson.com/v1/latest/zhCN/cards.all.json').then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(all){
      var known={}; cardDB.list.forEach(function(c){ if(c.dbfId!=null) known[c.dbfId]=1; });
      derivedDB.list=all.filter(function(c){ return c.dbfId!=null && c.name && !known[c.dbfId]; })
        .map(function(c){ return {name:c.name,cardClass:c.cardClass||'NEUTRAL',cost:c.cost!=null?c.cost:0,dbfId:c.dbfId,set:c.set||'',text:c.text||''}; });
      derivedDB.loaded=true; derivedDB.loading=false; render();
    })
    .catch(function(){ derivedDB.loading=false; });
}

  h+='<button class="tribe '+(b.set==='ALL'?'on':'')+'" onclick="state.browser.set=\'ALL\';state.browser.cls=\'ALL\';render();">全系列</button>';

  });
  h+='</div>';
  h+='<input id="cardSearch" value="'+esc(b.q)+'" oninput="state.browser.q=this.value;renderCardList();" placeholder="搜索卡牌名称…" style="width:100%;background:#0F131A;color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:12px;margin-bottom:8px;box-sizing:border-box;">';
  var clsKeys=['ALL','MAGE','HUNTER','PRIEST','WARLOCK','ROGUE','DRUID','SHAMAN','WARRIOR','PALADIN','DEMONHUNTER','DEATHKNIGHT','NEUTRAL'];
  h+='<div class="tribe-wrap" style="margin-bottom:8px;">';
  clsKeys.forEach(function(k){
    var label = k==='ALL'?'全部':(clsMap[k]||k);
    h+='<button class="tribe '+(b.cls===k?'on':'')+'" onclick="state.browser.cls=\''+k+'\';render();">'+label+'</button>';
  });

function renderCardList(){
  var el=document.getElementById('cardList'); if(!el)return;
  var b=state.browser;
  var q=(b.q||'').toLowerCase();
  var src;
  if(b.coll==='derived'){ src=derivedDB.list; }
  else if(b.coll==='all'){ src=cardDB.list.concat(derivedDB.list); }
  else { src=cardDB.list; }
  var list=src.filter(function(c){
    if(b.set!=='ALL' && c.set!==b.set) return false;
    if(b.cls!=='ALL' && c.cardClass!==b.cls) return false;
    if(q && !(c.name&&String(c.name).toLowerCase().indexOf(q)>-1)) return false;
    return true;
  });
  var seen={},out=[];
  list.forEach(function(c){
    if(c.name && !seen[c.name]){ seen[c.name]=1; out.push(c); }
  });
  var lim=b.limit||12;
  var totalCount=out.length;
  out=out.slice(0,lim);
  if(out.length===0){ el.innerHTML='<div style="font-size:11px;color:var(--muted);">无匹配卡牌</div>'; return; }
  var h='';
  out.forEach(function(c){
    h+='<div class="card-row">'+manaGem(c.cost==null?'?':c.cost)+
      '<div class="info"><div class="nm">'+esc(c.name)+'</div><div class="sub">'+(clsMap[c.cardClass]||c.cardClass||'')+(c.attack!=null?(' · '+c.attack+'/'+c.health):'')+(c.set?(' · '+esc(setName(c.set))):'')+'</div></div>'+
      '<span class="pill gray">'+(c.cost==null?'?':c.cost)+'费</span></div>';
    if(c.text){ h+='<div style="font-size:10px;color:var(--muted);margin:-3px 0 9px 34px;line-height:1.5;white-space:normal;">'+esc(stripHTML(c.text))+'</div>'; }
  });
  if(totalCount>lim){
    h+='<button class="btn blue block" style="margin-top:10px;" onclick="state.browser.limit=(state.browser.limit||12)+12;renderCardList();">加载更多卡牌（'+out.length+'/'+totalCount+'）</button>';
  }
  el.innerHTML=h;
}

   酒馆战棋数据库（HearthstoneJSON 同源，与炉石盒子/HDT 一致，每日自动更新）
   ============================================================ */
var BG_URL='battlegrounds.json';
var bgDB={loaded:false,minions:[],heroes:[],lastUpdated:null};
function applyBGDB(data){
  bgDB.minions = Array.isArray(data.minions)?data.minions:[];
  bgDB.heroes  = Array.isArray(data.heroes)?data.heroes:[];
  bgDB.loaded  = true;
}
function fetchFreshBGDB(){
  return fetch(BG_URL).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      applyBGDB(data);
      bgDB.lastUpdated=Date.now();
      try{ localStorage.setItem('hs_bg', JSON.stringify({ts:Date.now(),data:data})); }catch(e){}
      render(); return true;
    })
    .catch(function(){ return false; });
}
function loadBGDB(){
  if(bgDB.loaded) return Promise.resolve(true);
  var cached=null;
  try{ var c=localStorage.getItem('hs_bg'); if(c){ cached=JSON.parse(c); } }catch(e){}
  if(cached && cached.data){
    applyBGDB(cached.data);
    bgDB.lastUpdated=cached.ts||0;
    var age=Date.now()-(cached.ts||0);
    render();
    if(age < DAY) return Promise.resolve(true);
    fetchFreshBGDB();
    return Promise.resolve(true);
  }
  return fetchFreshBGDB();
}
function connectBGDB(){
  var btn=document.getElementById('bgConnectBtn');
  var st=document.getElementById('bgConnectStatus');
  if(btn) btn.disabled=true;
  if(st) st.innerHTML='<div style="font-size:11px;color:var(--muted);margin-top:8px;">正在加载真实酒馆战棋数据…</div>';
  loadBGDB().then(function(ok){
    if(st) st.innerHTML = ok
      ? '<div style="font-size:11px;color:var(--green);margin-top:8px;">✓ 酒馆战棋数据库已连接（'+bgDB.minions.length+' 随从 / '+bgDB.heroes.length+' 英雄）</div>'
      : '<div style="font-size:11px;color:var(--red);margin-top:8px;">加载失败，请检查网络后重试。</div>';
    render();
  });
}
function getHeroes(){ return bgDB.loaded?bgDB.heroes:heroes; }
function findHero(name){
  var list=getHeroes();
  for(var i=0;i<list.length;i++){ if(list[i].name===name) return list[i]; }
  return null;
}
function heroIsBase(hh){
  /* 皮肤以 _SKIN 后缀为准；无 _SKIN 即基础英雄（含 59t 等变体命名） */
  if(!hh.id) return true;
  return hh.id.indexOf('_SKIN')===-1;
}
function heroArtFallback(el){
  var fb='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" stroke="var(--gold)" stroke-width="1.5"/><path d="M5 20c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5" stroke="var(--gold)" stroke-width="1.5"/></svg></div>';
  var pp=el.parentNode; if(pp) pp.innerHTML=fb;
}
function getFilteredHeroes(){
  var list=getHeroes();
  /* 仅基础英雄：按英雄技能(hpId)分组，每组优先取基础(非皮肤)代表，彻底去除皮肤 */
  var best={}, order=[];
  list.forEach(function(hh){
    var key=hh.hpId||hh.name;
    if(!(key in best)){ best[key]=hh; order.push(key); }
    else if(heroIsBase(hh) && !heroIsBase(best[key])){ best[key]=hh; }
  });
  var out=[];
  order.forEach(function(k){ out.push(best[k]); });
  list=out;
  var q=(state.bg.heroSearch||'').toLowerCase();
  if(q) list=list.filter(function(hh){ return hh.name.toLowerCase().indexOf(q)>-1; });
  return list;
}

/* 截图导入：读取本地图片为 dataURL 用于展示/留存（浏览器无法自动识别画面，仅作对照记录） */
function readImgFile(target, cb){
  var f=target&&target.files&&target.files[0];
  if(!f) return;
  var r=new FileReader();
  r.onload=function(){ cb(r.result); };
  r.readAsDataURL(f);
}
/* 图片压缩：限制最大宽度+JPEG质量，避免大截图撑爆 localStorage */
function compressImage(dataURL, maxW, quality, cb){
  var img=new Image();
  img.onload=function(){
    try{
      var w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality||0.72));
    }catch(e){ cb(dataURL); }
  };
  img.onerror=function(){ cb(dataURL); };
  img.src=dataURL;
}
function pickImage(cb){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){ readImgFile(inp, function(d){ compressImage(d,1280,0.72,cb); }); };
  inp.click();
}

/* OCR 识别引擎：预下载中文模型，避免酒馆截图识别时等待 */
var ocrLoading=false;
function getOCRStatus(){
  if(ocrLoading) return 'loading';
  try{ return localStorage.getItem('hs_ocr_ready')==='1' ? 'ready' : 'idle'; }catch(e){ return 'idle'; }
}
function preloadOCR(){
  if(ocrLoading) return;
  ocrLoading=true; render();
  var done=function(){
    ocrLoading=false;
    try{ localStorage.setItem('hs_ocr_ready','1'); }catch(e){}
    render(); toast('OCR 中文模型已预下载完成');
  };
  var fail=function(msg){
    ocrLoading=false; render();
    toast('OCR 模型下载失败：'+(msg||'请检查网络后重试'));
  };
  function startWorker(){
    try{
      Tesseract.createWorker('chi_sim').then(function(worker){
        worker.terminate(); done();
      }).catch(function(e){ fail(e&&e.message?e.message:'模型加载失败'); });
    }catch(e){ fail(e.message); }
  }
  if(!window.Tesseract){
    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload=function(){ startWorker(); };
    sc.onerror=function(){ fail('引擎脚本加载失败'); };
    document.head.appendChild(sc);
  } else { startWorker(); }
}

/* 查看收藏卡组（不开始对局，仅显示卡牌列表与法力曲线） */

/* 查看卡组库中的卡组（解码后仅预览，不收藏不开始对局） */
function previewMetaDeck(name, code, cls, format){
  if(!cardDB.loaded){ showToast('请先在「设置」连接卡牌数据'); return; }
  var deck=decodeDeckstring(code);
  if(!deck){ showToast('卡组代码解析失败'); return; }

    var c=cardDB.byDbf[p[0]];

  });
  state.previewDeck={ id:'preview', name:name||'预览卡组', cls:cls||'中立', format:format||'标准', cards:cards };
  state.currentDeckId=null; render();
}
/* 选择卡组为当前，并载入对局追踪 */
function useDeckById(id){
  var d=state.decks.find(function(x){return x.id===id;});

  cardPool = d.cards.map(function(c){ return {name:c.name,cost:c.cost,tribe:'',total:c.count||1}; });

}
/* 从已解析的套牌代码保存到收藏 */
function saveParsedDeck(deck){

/* ============================================================
   对手开牌记录 + 卡组匹配

function addOppCard(){
  var sheet=document.getElementById('sheet');
  sheet.innerHTML='<h4>记录对手开牌 / 打出的牌</h4>'+
    '<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">记录你看到的对手卡牌，记牌器会匹配到最可能对应的卡组。</div>'+
    '<input id="oppCardInput" list="oppCardSuggest" style="width:100%;background:#0F131A;color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:10px;font-size:13px;" placeholder="输入卡牌名称">'+
    '<datalist id="oppCardSuggest"></datalist>'+
    '<button class="btn blue block" style="margin-top:10px;" onclick="commitOppCard()">加入记录</button>'+
    '<div id="oppMatchResult"></div>';
  document.getElementById('modalMask').classList.add('show');
  /* 填充建议 */
  if(cardDB.loaded){
    var dl=document.getElementById('oppCardSuggest'), opts='';
    cardDB.list.forEach(function(c){ if(c.name) opts+='<option value="'+esc(c.name)+'">'; });
    dl.innerHTML=opts;
  }
}
function commitOppCard(){
  var name=document.getElementById('oppCardInput').value.trim();
  if(!name){ showToast('请输入卡牌名称'); return; }
  addTo(state.match.oppSeen, name, -1);
  save(); closeModal(); render();
  showToast('已记录对手卡牌：'+name);
}
function matchDeckSuggestion(){
  var seen=state.match.oppSeen||[];
  if(seen.length===0) return '';
  var best=[];
  state.decks.forEach(function(d){
    var shared=0, dmap={};
    (d.cards||[]).forEach(function(c){ dmap[c.name]=(dmap[c.name]||0)+1; });
    seen.forEach(function(s){ if(dmap[s.name]) shared+=Math.min(s.count||1,dmap[s.name]); });
    best.push({d:d,shared:shared});
  });
  best.sort(function(a,b){return b.shared-a.shared;});
  var top=best[0];
  if(!top || top.shared===0) return '<div style="font-size:10px;color:var(--muted);margin-top:6px;">暂无匹配的收藏卡组</div>';
  return '<div style="font-size:10px;color:var(--gold);margin-top:6px;">最匹配卡组：<b>'+esc(top.d.name)+'</b>（命中 '+top.shared+' 张）</div>';
}

var newMatchPrompted=false;
function doStartNewMatch(from, isBG){
  if(isBG){
    state.bg.hero=null; state.bg.tavern=[]; state.bg.owned=[]; state.bg.tribes={};
    state.bg.turn=1; state.bg.gold=3; state.bg.tier=1; state.bg.hp=40;
    state.tab='constructed'; state.matchMode='battlegrounds'; state.inMatch=true;
  }else{
    state.tab='constructed'; state.matchMode='standard';
    startMatch();
  }
  var s=document.getElementById('screen');
  if(s){ var b=document.getElementById('newMatchBanner'); if(b) b.remove(); }
  showToast(isBG?'已检测到游戏开始，已进入酒馆战棋记牌':'已检测到游戏开始，已自动开始对局');
  render();
}
/* 通道一：快捷指令直接打开带参 URL（?hs=start[&mode=bg][&cls=法师]） */
function signalFromURL(){
  var m=location.search.match(/[?&]hs=(start|stop)/i);
  if(!m) return false;
  history.replaceState(null,'',location.pathname+location.hash);
  if(m[1].toLowerCase()==='start'){
    var qs=new URLSearchParams(location.search);
    var md=qs.get('mode')||qs.get('m'), cls=qs.get('cls');
    if(cls && classes.indexOf(cls)>-1) state.setup.myClass=cls;
    doStartNewMatch('快捷指令', md==='bg'||md==='battlegrounds');
  }
  return true;
}
/* 通道三：iOS 快捷指令截图 → 分享到 PWA（Web Share Target）→ SW 缓存 → 页面接收分析 */
var pendingShot=null, pendingOCRMinions=[];
function receiveSharedShot(){
  if(location.search.indexOf('shared=1')<0) return;
  history.replaceState(null,'',location.pathname+location.hash);
  fetch('./shared-shot').then(function(r){ if(!r.ok) throw 0; return r.blob(); })
    .then(function(blob){
      if(!blob || blob.size===0){ toast('分享截图为空，请重新截图分享'); return; }
      var fr=new FileReader();
      fr.onload=function(){ pendingShot=fr.result; toast('正在自动识别截图中的随从阵容…'); analyzeAndSaveShot(); };
      fr.onerror=function(){ toast('截图读取失败，请重试'); };
      fr.readAsDataURL(blob);
    }).catch(function(){ toast('未收到分享截图，请确认已安装到主屏幕'); });
}
function showShotImportSheet(dataURL){
  pendingShot=dataURL; pendingOCRMinions=[];
  var m=document.getElementById('modalMask'), s=document.getElementById('sheet');
  s.innerHTML='<div style="font-size:14px;font-weight:600;margin-bottom:8px;">收到快捷指令截图</div>'+
    '<img id="sharedShotImg" src="'+dataURL+'" onerror="document.getElementById(\'sharedShotErr\').style.display=\'block\';this.style.display=\'none\';" style="width:100%;border-radius:10px;margin-bottom:10px;max-height:38vh;object-fit:contain;background:#000;display:block;">'+
    '<div id="sharedShotErr" style="display:none;font-size:11px;color:var(--red);margin-bottom:10px;padding:8px 10px;background:rgba(234,102,104,.1);border-radius:8px;">图片加载失败，截图格式可能不兼容，请重新截图后分享。</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-bottom:10px;">选择保存位置，或先智能识别随从阵容：</div>'+
    '<div class="settle-row" style="margin-bottom:8px;">'+
      '<button class="btn blue" style="flex:1;" onclick="saveShotTo(\'my\',false)">我方阵容</button>'+
      '<button class="btn blue" style="flex:1;" onclick="saveShotTo(\'opp\',false)">对手阵容</button>'+
    '</div>'+
    '<button class="btn gray block" onclick="analyzeAndSaveShot()">智能识别随从阵容</button>'+
    '<button class="btn gray block" style="margin-top:8px;" onclick="closeModal()">取消</button>';
  m.classList.add('show');
}
function saveShotTo(side, useOCR){
  if(!pendingShot) return;
  var shot=pendingShot; pendingShot=null;
  compressImage(shot,1280,0.72,function(d){
    var b=state.bg;
    if(side==='my'){
      b.boardShot=d;
      if(useOCR && pendingOCRMinions.length){
        pendingOCRMinions.forEach(function(mm){
          b.owned.push({name:mm.name,cost:mm.cost,tribe:mm.tribe||'',tier:mm.tier||1,a:mm.a||1,h:mm.h||1,sold:false,tripled:false});
          if(mm.tribe) b.tribes[mm.tribe]=true;
        });
      }
    } else {
      while(b.opponents.length<6) b.opponents.push({name:'',tribes:[],shot:null,defeated:false,turn:0,minions:[]});
      var cur=b.opponents[b.oppIdx]; cur.shot=d; cur.turn=b.turn;
      if(useOCR && pendingOCRMinions.length){
        cur.minions=cur.minions||[];
        pendingOCRMinions.forEach(function(mm){
          cur.minions.push({name:mm.name,cost:mm.cost,tribe:mm.tribe||'',tier:mm.tier||1,a:mm.a||1,h:mm.h||1});
          if(mm.tribe && cur.tribes.indexOf(mm.tribe)<0) cur.tribes.push(mm.tribe);
        });
      }
    }
    pendingOCRMinions=[]; closeModal(); save(); render();
    toast('已保存到'+(side==='my'?'我方阵容':'对手阵容'));
  });
}
function analyzeAndSaveShot(){
  if(!pendingShot) return;
  if(!window.Tesseract){
    toast('正在加载识别引擎…');
    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload=function(){ runOCR(pendingShot); };
    sc.onerror=function(){ toast('识别引擎加载失败'); };
    document.head.appendChild(sc);
  } else { runOCR(pendingShot); }
}
function runOCR(dataURL){
  toast('正在识别截图文字（首次需下载中文模型）…');
  Tesseract.recognize(dataURL,'chi_sim').then(function(res){
    var text=(res&&res.data&&res.data.text)||'';
    var matched=matchMinionsFromText(text);
    pendingOCRMinions=matched;
    showOCRResultSheet(dataURL, text, matched);
  }).catch(function(){ toast('识别失败，可手动选择保存位置'); if(pendingShot) showShotImportSheet(pendingShot); });
}
function matchMinionsFromText(text){
  var pool=(bgDB.loaded&&bgDB.minions.length)?bgDB.minions:bgPool;
  var t=String(text||'').replace(/\s+/g,'');
  var matched=[];
  pool.forEach(function(m){
    if(!m||!m.name) return;
    var nm=String(m.name).replace(/\s+/g,'');
    if(nm.length>=2 && t.indexOf(nm)>-1) matched.push(m);
  });
  return matched.slice(0,14);
}
function showOCRResultSheet(dataURL, text, matched){
  pendingShot=dataURL;
  var m=document.getElementById('modalMask'), s=document.getElementById('sheet');
  var list=matched.length? matched.map(function(mm){
    return '<div style="font-size:11px;padding:3px 0;color:var(--text);">· '+esc(mm.name)+' <span style="color:var(--muted);">('+(mm.cost!=null?mm.cost:'?')+'星 · '+esc(mm.tribe||'无')+')</span></div>';
  }).join('') : '<div style="font-size:11px;color:var(--muted);">未识别到随从名称（炉石艺术字体识别率有限），可保存截图后手动点选。</div>';
  s.innerHTML='<div style="font-size:14px;font-weight:600;margin-bottom:6px;">自动识别结果（'+matched.length+' 个随从）</div>'+
    '<img src="'+dataURL+'" onclick="openImage(this.src)" style="width:100%;border-radius:10px;margin-bottom:8px;max-height:28vh;object-fit:contain;background:#000;display:block;cursor:zoom-in;">'+
    '<div style="max-height:22vh;overflow-y:auto;margin-bottom:10px;">'+list+'</div>'+
    '<div style="font-size:10px;color:var(--muted);margin-bottom:8px;">识别结果可编辑，保存后在阵容中可手动增删随从。</div>'+
    '<div class="settle-row" style="margin-bottom:8px;">'+
      '<button class="btn blue" style="flex:1;" onclick="saveShotTo(\'my\',true)">保存到我方阵容</button>'+
      '<button class="btn blue" style="flex:1;" onclick="saveShotTo(\'opp\',true)">保存到对手阵容</button>'+
    '</div>'+
    '<button class="btn gray block" onclick="showShotImportSheet(pendingShot)">仅保存截图（不识别随从）</button>'+
    '<button class="btn gray block" style="margin-top:8px;" onclick="closeModal()">取消</button>';
  m.classList.add('show');
}
/* iOS 全自动快捷指令：内嵌 JSON，用 data URI 强制下载（不依赖服务器 Content-Type） */
var SHORTCUT_JSON = JSON.stringify({"WFWorkflowClientVersion":"700","WFWorkflowImportQuestions":[],"WFWorkflowActions":[{"WFWorkflowActionIdentifier":"is.workflow.actions.takescreenshot","WFWorkflowActionParameters":{}},{"WFWorkflowActionIdentifier":"is.workflow.actions.share","WFWorkflowActionParameters":{}}]});
function downloadShortcut(){
  var blob=new Blob([SHORTCUT_JSON],{type:'application/octet-stream'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='auto-shot.shortcut';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },2000);
}
/* 通过系统分享面板传递快捷指令文件（绕过未签名限制，最可靠） */
function shareShortcut(){
  var blob=new Blob([SHORTCUT_JSON],{type:'application/octet-stream'});
  var file=new File([blob],'auto-shot.shortcut',{type:'application/octet-stream'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'炉石记牌器-自动截图上传'}).catch(function(){});
  } else {
    toast('当前浏览器不支持分享文件，请用下载文件方式');
    downloadShortcut();
  }
}

/* 通道二：快捷指令写入剪贴板标记 HS_START，切回前台时读取 */
function readClipboardSignal(){
  if(!navigator.clipboard || !navigator.clipboard.readText) return maybeNewMatchBanner();
  navigator.clipboard.readText().then(function(t){
    t=(t||'');
    if(t.indexOf('HS_START')===0){
      if(navigator.clipboard.writeText) navigator.clipboard.writeText('').catch(function(){});
      doStartNewMatch('快捷指令');
    } else {
      maybeNewMatchBanner();
    }
  }).catch(function(){ maybeNewMatchBanner(); });
}
function maybeNewMatchBanner(){
  if(!document.hidden && !state.matchActive && !state.bg.hero && !newMatchPrompted){
    newMatchPrompted=true;
    var screen=document.getElementById('screen');
    if(!screen || screen.innerHTML.indexOf('newMatchBanner')>-1) return;
    var b=document.createElement('div');
    b.id='newMatchBanner';
    b.style.cssText='background:rgba(217,179,108,.14);border:1px solid rgba(217,179,108,.45);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;';
    b.innerHTML='<span style="flex:1;color:var(--gold2);">已回到前台，是否开始新对局？</span>'+
      '<button class="btn primary" style="padding:6px 12px;font-size:11px;" onclick="startMatch();this.closest(\'#newMatchBanner\').remove();">开始</button>'+
      '<button class="btn gray" style="padding:6px 10px;font-size:11px;" onclick="this.closest(\'#newMatchBanner\').remove();">暂不</button>';
    screen.insertBefore(b, screen.firstChild);
  }
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden){
    if(navigator.clipboard && navigator.clipboard.readText){ readClipboardSignal(); }
    else { maybeNewMatchBanner(); }
  }
});
